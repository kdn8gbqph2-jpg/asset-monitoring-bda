# /etc/nginx/sites-available/services-bdabharatpur
# Static-only site for https://services.bdabharatpur.org
# Certbot will rewrite/extend this file after running
#   sudo certbot --nginx -d services.bdabharatpur.org

server {
    listen 80;
    listen [::]:80;
    server_name services.bdabharatpur.org;

    root /var/www/services-bdabharatpur;
    index index.html;

    # Emit charset in the Content-Type header (prevents mis-rendered
    # punctuation like the em-dash in the page title / meta description)
    charset utf-8;

    # Hide Nginx version
    server_tokens off;

    # Security headers
    add_header X-Frame-Options            "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options     "nosniff"                      always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;

    # Long-cache static assets; html short-cache
    location ~* \.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # This is a single static page (no client-side router), so unknown
    # paths should return a real 404 instead of a "soft 404" that serves
    # index.html with a 200 — the latter creates duplicate-content URLs.
    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/services-bdabharatpur.access.log;
    error_log  /var/log/nginx/services-bdabharatpur.error.log;
}
