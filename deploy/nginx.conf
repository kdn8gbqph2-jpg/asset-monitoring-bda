# /etc/nginx/sites-available/asset-monitoring
# Symlink to sites-enabled:
#   sudo ln -s /etc/nginx/sites-available/asset-monitoring /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # ── SSL (managed by Certbot — do not edit these lines manually) ────────
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Static files served directly by Nginx (faster, bypasses Kestrel) ──
    location /css/ {
        root /var/www/asset-monitoring/wwwroot;
        expires 7d;
        add_header Cache-Control "public";
    }
    location /js/ {
        root /var/www/asset-monitoring/wwwroot;
        expires 7d;
        add_header Cache-Control "public";
    }
    location /lib/ {
        root /var/www/asset-monitoring/wwwroot;
        expires 30d;
        add_header Cache-Control "public";
    }
    location /images/ {
        root /var/www/asset-monitoring/wwwroot;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── Proxy all other requests to Kestrel ────────────────────────────────
    location / {
        proxy_pass         http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        keep-alive;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Increase timeouts for report downloads
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Logging ────────────────────────────────────────────────────────────
    access_log /var/log/nginx/asset-monitoring-access.log;
    error_log  /var/log/nginx/asset-monitoring-error.log;
}
